<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Criador de Personagens</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #080c14; color: #f9fafb; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    h1 { text-align: center; font-size: 1.6rem; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: #9ca3af; font-size: 0.85rem; margin-bottom: 20px; }
    .panel { background-color: #111827; border-radius: 18px; padding: 20px; border: 1px solid #1f2937; }
    
    /* Círculo do avatar completo */
    .avatar-stage {
      width: 180px; height: 180px; margin: 0 auto 18px auto; border-radius: 50%;
      background: #1e293b; border: 3px solid #38bdf8; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    
    .avatar-img { 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
    }

    .gender-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; background: #07090e; padding: 4px; border-radius: 10px; }
    .gender-btn { padding: 9px; border: none; border-radius: 8px; background: transparent; color: #9ca3af; font-weight: bold; cursor: pointer; }
    .gender-btn.active { background: #38bdf8; color: #090d16; }
    
    .controls-grid { display: flex; flex-direction: column; gap: 10px; }
    .control-row { display: flex; align-items: center; justify-content: space-between; background: #07090e; border: 1px solid #1f2937; padding: 12px 16px; border-radius: 10px; }
    .control-label { font-size: 0.85rem; color: #9ca3af; text-transform: uppercase; font-weight: bold; }
    .arrow-group { display: flex; align-items: center; gap: 12px; }
    .arrow-btn { background: #1f2937; color: #fff; border: none; width: 36px; height: 36px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .arrow-btn:active { background: #38bdf8; color: #090d16; }
    .value-display { font-size: 0.95rem; font-weight: bold; width: 90px; text-align: center; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Escolhe a tua Aparência</p>
    <div class="panel">
      <div class="avatar-stage">
        <img id="avatarDisplay" class="avatar-img" src="" alt="Avatar">
      </div>
      
      <div class="gender-tabs">
        <button class="gender-btn active" data-gender="masculino">Homem</button>
        <button class="gender-btn" data-gender="feminino">Mulher</button>
      </div>

      <div class="controls-grid">
        <div class="control-row">
          <span class="control-label">Avatar</span>
          <div class="arrow-group">
            <button class="arrow-btn" onclick="changeAvatar(-1)">◀</button>
            <span class="value-display" id="avatarIndexDisplay">#1</span>
            <button class="arrow-btn" onclick="changeAvatar(1)">▶</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const assets = {
      masculino: {
        total: 5, // 5 avatares masculinos (Avatar_masculino_1 até 5)
        prefix: "Avatar_masculino_",
        folder: "masculino"
      },
      feminino: {
        total: 2, // 2 avatares femininos (Avatar_feminino_1 até 2)
        prefix: "Avatar_feminino_",
        folder: "feminino"
      }
    };

    let state = {
      gender: "masculino",
      currentIndex: 0
    };

    function updateAvatar() {
      const g = state.gender;
      const data = assets[g];
      
      const filename = `${data.prefix}${state.currentIndex + 1}.png`;
      document.getElementById("avatarDisplay").src = `assets/modules/${data.folder}/avatars/${filename}`;
      document.getElementById("avatarIndexDisplay").textContent = `#${state.currentIndex + 1}`;
    }

    window.changeAvatar = function(direction) {
      const g = state.gender;
      const total = assets[g].total;
      
      state.currentIndex += direction;
      
      if (state.currentIndex < 0) {
        state.currentIndex = total - 1;
      } else if (state.currentIndex >= total) {
        state.currentIndex = 0;
      }
      
      updateAvatar();
    };

    document.querySelectorAll(".gender-btn").forEach(btn => {
      btn.onclick = () => {
        state.gender = btn.dataset.gender;
        document.querySelectorAll(".gender-btn").forEach(b => b.classList.toggle("active", b === btn));
        state.currentIndex = 0;
        updateAvatar();
      };
    });

    document.addEventListener("DOMContentLoaded", updateAvatar);
  </script>
</body>
</html>
