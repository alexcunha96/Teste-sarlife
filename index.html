<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Criador de Personagens</title>
  <style>
    :root {
      --bg-color: #080c14;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }

    h1 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .avatar-stage {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #070a11 85%);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      position: relative;
      overflow: hidden; /* Corta tudo o que sair fora do círculo perfeito */
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Ajusta a imagem para preencher o espaço sem distorcer */
      mix-blend-mode: multiply; /* Tenta eliminar o fundo branco automaticamente se as imagens forem JPG/PNG com branco */
      pointer-events: none;
    }

    /* Força a camada do rosto a ficar sem o efeito de mistura para manter as cores reais */
    #layerBase {
      mix-blend-mode: normal;
    }

    .gender-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      background: #07090e;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .gender-btn {
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gender-btn.active { background: var(--accent); color: #090d16; }

    .controls-grid { display: flex; flex-direction: column; gap: 10px; }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #07090e;
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .control-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; width: 80px; }
    
    .arrow-group { display: flex; align-items: center; gap: 10px; }
    .arrow-btn {
      background: #1f2937;
      color: var(--text-main);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .arrow-btn:active { background: var(--accent); color: #090d16; }
    .value-display { font-size: 0.85rem; font-weight: 600; width: 90px; text-align: center; color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Criador de Personagens</p>

    <div class="panel">
      <div class="avatar-stage">
        <!-- Camadas do Avatar -->
        <img id="layerBase" class="avatar-layer" src="" alt="Rosto">
        <img id="layerEyes" class="avatar-layer" src="" alt="Olhos">
        <img id="layerHair" class="avatar-layer" src="" alt="Cabelo">
        <img id="layerBeard" class="avatar-layer" src="" alt="Barba">
        <img id="layerGlasses" class="avatar-layer" src="" alt="Óculos">
      </div>

      <div class="gender-tabs">
        <button class="gender-btn active" data-gender="masculino">Homem</button>
        <button class="gender-btn" data-gender="feminino">Mulher</button>
      </div>

      <div class="controls-grid" id="controlsGrid"></div>
    </div>
  </div>

  <script>
    const assets = {
      masculino: {
        caras: ["rostos_001", "rostos_002"], 
        olhos: ["olhos_001"],
        cabelos: ["barbas_bigodes_005", "barbas_bigodes_006"], 
        barbas: ["none", "barba_01"],
        oculos: ["none"]
      },
      feminino: {
        caras: ["rostos_f_001"],
        olhos: ["olhos_f_001"],
        cabelos: ["cabelos_f_001"],
        oculos: ["none"]
      }
    };

    let state = {
      gender: "masculino",
      caras: 0,
      olhos: 0,
      cabelos: 0,
      barbas: 0,
      oculos: 0
    };

    function updateAvatar() {
      const g = state.gender;
      
      const caraList = assets[g].caras;
      const olhosList = assets[g].olhos;
      const cabeloList = assets[g].cabelos;
      const barbaList = assets[g].barbas || ["none"];
      const oculosList = assets[g].oculos;

      document.getElementById("layerBase").src = caraList.length ? `assets/modules/${g}/caras/${caraList[state.caras]}.png` : "";
      document.getElementById("layerEyes").src = olhosList.length ? `assets/modules/${g}/olhos/${olhosList[state.olhos]}.png` : "";
      document.getElementById("layerHair").src = cabeloList.length ? `assets/modules/${g}/cabelos/${cabeloList[state.cabelos]}.png` : "";
      
      const beardImg = document.getElementById("layerBeard");
      if (g === "feminino" || !barbaList[state.barbas] || barbaList[state.barbas] === "none") {
        beardImg.src = "";
      } else {
        beardImg.src = `assets/modules/${g}/barbas/${barbaList[state.barbas]}.png`;
      }

      const oculosVal = oculosList[state.oculos];
      document.getElementById("layerGlasses").src = (!oculosVal || oculosVal === "none") ? "" : `assets/modules/${g}/oculos/${oculosVal}.png`;

      renderControls();
    }

    function renderControls() {
      const g = state.gender;
      const container = document.getElementById("controlsGrid");
      container.innerHTML = "";

      const categories = [
        { key: "caras", label: "Cara" },
        { key: "olhos", label: "Olhos" },
        { key: "cabelos", label: "Cabelo" },
      ];

      if (g === "masculino") {
        categories.push({ key: "barbas", label: "Barba" });
      }
      categories.push({ key: "oculos", label: "Óculos" });

      categories.forEach(cat => {
        const list = assets[g][cat.key] || ["none"];
        const currentIndex = state[cat.key];
        const currentName = list[currentIndex] === "none" ? "Nenhum" : `#${currentIndex + 1}`;

        const row = document.createElement("div");
        row.className = "control-row";
        row.innerHTML = `
          <span class="control-label">${cat.label}</span>
          <div class="arrow-group">
            <button class="arrow-btn" onclick="changeItem('${cat.key}', -1)">◀</button>
            <span class="value-display">${currentName}</span>
            <button class="arrow-btn" onclick="changeItem('${cat.key}', 1)">▶</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    window.changeItem = function(category, direction) {
      const g = state.gender;
      const list = assets[g][category] || ["none"];
      
      state[category] += direction;
      if (state[category] < 0) state[category] = list.length - 1;
      if (state[category] >= list.length) state[category] = 0;

      updateAvatar();
    };

    document.querySelectorAll(".gender-btn").forEach(btn => {
      btn.onclick = () => {
        state.gender = btn.dataset.gender;
        document.querySelectorAll(".gender-btn").forEach(b => b.classList.toggle("active", b === btn));
        
        state.caras = 0; state.olhos = 0; state.cabelos = 0; state.barbas = 0; state.oculos = 0;
        updateAvatar();
      };
    });

    document.addEventListener("DOMContentLoaded", () => {
      updateAvatar();
    });
  </script>
</body>
</html>
