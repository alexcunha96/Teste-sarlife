<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Criador de Personagens</title>
  <style>
    :root {
      --bg-color: #080c14;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }

    h1 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .avatar-stage {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #070a11 85%);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .gender-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      background: #07090e;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .gender-btn {
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gender-btn.active { background: var(--accent); color: #090d16; }

    .grid-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .control-group { margin-bottom: 12px; }
    .control-group.full { grid-column: span 2; }
    .control-group label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; }
    
    input[type="text"] {
      width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--panel-border);
      background-color: #07090e; color: var(--text-main); font-size: 0.88rem; outline: none;
    }
    
    .hint { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; display: block; }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Criador de Personagens</p>

    <div class="panel">
      <div class="avatar-stage">
        <!-- Camadas do Avatar -->
        <img id="layerBase" class="avatar-layer" src="" alt="Rosto">
        <img id="layerEyes" class="avatar-layer" src="" alt="Olhos">
        <img id="layerHair" class="avatar-layer" src="" alt="Cabelo">
        <img id="layerBeard" class="avatar-layer" src="" alt="Barba">
        <img id="layerGlasses" class="avatar-layer" src="" alt="Óculos">
      </div>

      <div class="gender-tabs">
        <button class="gender-btn active" data-gender="masculino">Homem</button>
        <button class="gender-btn" data-gender="feminino">Mulher</button>
      </div>

      <div class="grid-controls">
        <!-- Rosto -->
        <div class="control-group full">
          <label>Nome do Ficheiro da Cara</label>
          <input type="text" id="inputBase" value="exemplo" placeholder="ex: rostos_001">
          <span class="hint">Ex: se o ficheiro for rostos_001.png, escreve rostos_001</span>
        </div>

        <!-- Olhos -->
        <div class="control-group">
          <label>Nome dos Olhos</label>
          <input type="text" id="inputEyes" value="" placeholder="ex: olhos_001">
        </div>

        <!-- Cabelo -->
        <div class="control-group">
          <label>Nome do Cabelo</label>
          <input type="text" id="inputHair" value="" placeholder="ex: barbas_005">
        </div>

        <!-- Barba (Homem) -->
        <div class="control-group" id="beardContainer">
          <label>Nome da Barba</label>
          <input type="text" id="inputBeard" value="" placeholder="ex: barba_01">
        </div>

        <!-- Óculos -->
        <div class="control-group" id="glassesContainer">
          <label>Nome dos Óculos</label>
          <input type="text" id="inputGlasses" value="" placeholder="ex: oculos_01">
        </div>
      </div>
    </div>
  </div>

  <script>
    let state = {
      gender: "masculino",
      base: "",
      eyes: "",
      hair: "",
      beard: "",
      glasses: ""
    };

    function updateAvatar() {
      const folder = `assets/modules/${state.gender}`;

      document.getElementById("layerBase").src = state.base ? `${folder}/caras/${state.base}.png` : "";
      document.getElementById("layerEyes").src = state.eyes ? `${folder}/olhos/${state.eyes}.png` : "";
      document.getElementById("layerHair").src = state.hair ? `${folder}/cabelos/${state.hair}.png` : "";
      
      const beardImg = document.getElementById("layerBeard");
      if (state.gender === "feminino" || !state.beard) {
        beardImg.src = "";
      } else {
        beardImg.src = `${folder}/barbas/${state.beard}.png`;
      }

      document.getElementById("layerGlasses").src = state.glasses ? `${folder}/oculos/${state.glasses}.png` : "";
    }

    document.addEventListener("DOMContentLoaded", () => {
      // Botões de Género
      document.querySelectorAll(".gender-btn").forEach(btn => {
        btn.onclick = () => {
          state.gender = btn.dataset.gender;
          document.querySelectorAll(".gender-btn").forEach(b => b.classList.toggle("active", b === btn));
          
          const beardContainer = document.getElementById("beardContainer");
          beardContainer.style.display = (state.gender === "feminino") ? "none" : "block";
          if (state.gender === "feminino") state.beard = "";
          
          updateAvatar();
        };
      });

      // Inputs de texto para testar rapidamente os nomes dos ficheiros
      document.getElementById("inputBase").oninput = (e) => { state.base = e.target.value.trim(); updateAvatar(); };
      document.getElementById("inputEyes").oninput = (e) => { state.eyes = e.target.value.trim(); updateAvatar(); };
      document.getElementById("inputHair").oninput = (e) => { state.gear = e.target.value.trim(); updateAvatar(); }; // Corrigido abaixo
      document.getElementById("inputHair").oninput = (e) => { state.hair = e.target.value.trim(); updateAvatar(); };
      document.getElementById("inputBeard").oninput = (e) => { state.beard = e.target.value.trim(); updateAvatar(); };
      document.getElementById("inputGlasses").oninput = (e) => { state.glasses = e.target.value.trim(); updateAvatar(); };
    });
  </script>
</body>
</html>
