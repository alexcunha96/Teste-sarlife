<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Cinematic Art Studio</title>
  <style>
    :root {
      --bg-color: #07090e;
      --panel-bg: #111622;
      --panel-border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    
    h1 { text-align: center; margin-bottom: 4px; color: var(--accent); font-size: 1.5rem; letter-spacing: 0.5px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1.5px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .avatar-showcase {
      width: 160px;
      height: 160px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 30px var(--accent-glow);
      overflow: hidden;
      background: #0b0f19;
    }

    .avatar-showcase svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-group { margin-bottom: 14px; }
    .control-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.8px; }
    
    select {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--panel-border);
      background-color: #07090e; color: var(--text-main); font-size: 0.95rem; outline: none; transition: border-color 0.2s;
    }
    select:focus { border-color: var(--accent); }

    .swatches { display: flex; gap: 8px; margin-top: 4px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      box-shadow: 0 3px 6px rgba(0,0,0,0.4); transition: transform 0.15s ease, border-color 0.15s;
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.15); }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Cinematic Portrait Engine</p>

    <div class="panel">
      <div id="avatarContainer" class="avatar-showcase"></div>

      <div class="control-group">
        <label>Tom de Pele (Estúdio)</label>
        <div class="swatches" id="skinSwatches">
          <button class="swatch active" data-color="#ffd8be" style="background: #ffd8be;"></button>
          <button class="swatch" data-color="#d99f68" style="background: #d99f68;"></button>
          <button class="swatch" data-color="#9e663d" style="background: #9e663d;"></button>
          <button class="swatch" data-color="#51301d" style="background: #51301d;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Penteado / Estilo de Cabelo</label>
        <select id="hairStyleSelect">
          <option value="modernExecutive">Executivo Texturizado</option>
          <option value="messyArtistic">Estilo Artístico / Ondulado</option>
          <option value="shortCrop">Curto Militar Premium</option>
        </select>
      </div>

      <div class="control-group">
        <label>Tom de Cabelo</label>
        <div class="swatches" id="hairSwatches">
          <button class="swatch active" data-color="#141416" style="background: #141416;"></button>
          <button class="swatch" data-color="#854d0e" style="background: #854d0e;"></button>
          <button class="swatch" data-color="#d97706" style="background: #d97706;"></button>
          <button class="swatch" data-color="#cbd5e1" style="background: #cbd5e1;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Atitude / Expressão</label>
        <select id="moodSelect">
          <option value="ambitious">Ambicioso / Focado</option>
          <option value="confident">Confiante / Sucesso</option>
          <option value="serious">Sério / Intenso</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const state = {
      skin: "#ffd8be",
      hairStyle: "modernExecutive",
      hairColor: "#141416",
      mood: "ambitious"
    };

    function renderAvatar() {
      let hairHTML = "";
      if (state.hairStyle === "modernExecutive") {
        hairHTML = `
          <path d="M 23 35 C 19 12, 35 2, 50 6 C 65 2, 81 12, 77 35 C 85 28, 89 42, 77 48 C 68 36, 58 38, 50 38 C 42 38, 32 36, 23 48 C 11 42, 15 28, 23 35 Z" fill="${state.hairColor}" />
          <path d="M 32 18 Q 50 8, 68 18" stroke="rgba(255,255,255,0.22)" stroke-width="3.5" stroke-linecap="round" fill="none" />
        `;
      } else if (state.hairStyle === "messyArtistic") {
        hairHTML = `
          <path d="M 21 38 C 17 14, 33 2, 50 6 C 67 2, 83 14, 79 38 C 87 32, 93 48, 77 52 C 67 38, 57 41, 50 41 C 43 41, 33 38, 23 52 C 7 48, 13 32, 21 38 Z" fill="${state.hairColor}" />
          <circle cx="34" cy="12" r="9" fill="${state.hairColor}" />
          <circle cx="50" cy="8" r="11" fill="${state.hairColor}" />
          <circle cx="66" cy="12" r="9" fill="${state.hairColor}" />
        `;
      } else if (state.hairStyle === "shortCrop") {
        hairHTML = `
          <path d="M 26 35 C 24 16, 76 16, 74 35 C 68 22, 32 22, 26 35 Z" fill="${state.hairColor}" />
        `;
      }

      let mouthHTML = "";
      if (state.mood === "ambitious") {
        mouthHTML = `<path d="M 40 65 Q 50 68 60 65" stroke="#3d1c1c" stroke-width="3" stroke-linecap="round" fill="none" />`;
      } else if (state.mood === "confident") {
        mouthHTML = `
          <path d="M 38 63 Q 50 72 62 63" stroke="#3d1c1c" stroke-width="3.2" stroke-linecap="round" fill="#f43f5e" fill-opacity="0.6" />
          <path d="M 41 63 Q 50 67 59 63" stroke="#3d1c1c" stroke-width="2" fill="none" />
        `;
      } else if (state.mood === "serious") {
        mouthHTML = `<line x1="41" y1="65" x2="59" y2="65" stroke="#3d1c1c" stroke-width="3" stroke-linecap="round" />`;
      }

      const svg = `
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="cinematicSkin" cx="50%" cy="28%" r="72%">
              <stop offset="0%" stop-color="${state.skin}" />
              <stop offset="70%" stop-color="${state.skin}" />
              <stop offset="100%" stop-color="#1e130d" stop-opacity="0.45" />
            </radialGradient>
            <linearGradient id="luxurySuit" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#090d16" />
            </linearGradient>
            <radialGradient id="rimLight" cx="50%" cy="20%" r="80%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
              <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Fundo escuro com iluminação ambiente de estúdio -->
          <circle cx="50" cy="50" r="48" fill="#0b0f19" />
          <circle cx="50" cy="50" r="48" fill="url(#rimLight)" />

          <!-- Casaco / Fato Executivo com lapela elegante -->
          <path d="M 16 96 C 18 68, 82 68, 84 96 Z" fill="url(#luxurySuit)" />
          <path d="M 37 68 L 50 84 L 63 68 Z" fill="#f8fafc" opacity="0.95" />
          <path d="M 43 68 L 50 78 L 57 68 Z" fill="#0b0f19" />
          <path d="M 37 68 L 26 96 L 33 96 Z" fill="#0f172a" />
          <path d="M 63 68 L 74 96 L 67 96 Z" fill="#0f172a" />

          <!-- Pescoço com sombra profunda -->
          <rect x="41" y="58" width="18" height="24" fill="url(#cinematicSkin)" />

          <!-- Orelhas refinadas -->
          <circle cx="26" cy="46" r="5.5" fill="url(#cinematicSkin)" />
          <circle cx="74" cy="46" r="5.5" fill="url(#cinematicSkin)" />

          <!-- Rosto principal (Proporção equilibrada e madura) -->
          <rect x="27" y="19" width="46" height="52" rx="21" fill="url(#cinematicSkin)" />

          <!-- Olhos de Alta Qualidade com brilho cinematográfico -->
          <g>
            <ellipse cx="37" cy="44" rx="4.8" ry="5.2" fill="#ffffff" />
            <circle cx="37" cy="44" r="3" fill="#0f172a" />
            <circle cx="35.5" cy="42.5" r="1.1" fill="#ffffff" />
            <circle cx="38.5" cy="45.5" r="0.4" fill="#ffffff" />
          </g>
          <g>
            <ellipse cx="63" cy="44" rx="4.8" ry="5.2" fill="#ffffff" />
            <circle cx="63" cy="44" r="3" fill="#0f172a" />
            <circle cx="61.5" cy="42.5" r="1.1" fill="#ffffff" />
            <circle cx="64.5" cy="45.5" r="0.4" fill="#ffffff" />
          </g>

          <!-- Sobrancelhas marcantes e expressivas -->
          <path d="M 31 36 Q 37 32, 43 36" stroke="${state.hairColor}" stroke-width="2.6" stroke-linecap="round" fill="none" />
          <path d="M 57 36 Q 63 32, 69 36" stroke="${state.hairColor}" stroke-width="2.6" stroke-linecap="round" fill="none" />

          <!-- Nariz refinado e estruturado -->
          <path d="M 50 42 L 47.5 52 L 52.5 52" stroke="rgba(0,0,0,0.18)" stroke-width="2" fill="none" stroke-linecap="round" />

          <!-- Boca -->
          ${mouthHTML}

          <!-- Camada de Cabelo Dinâmica -->
          ${hairHTML}
        </svg>
      `;

      const container = document.getElementById("avatarContainer");
      if (container) {
        container.innerHTML = svg;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("#skinSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#skinSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.skin = btn.dataset.color;
          renderAvatar();
        };
      });

      document.querySelectorAll("#hairSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#hairSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.hairColor = btn.dataset.color;
          renderAvatar();
        };
      });

      document.getElementById("hairStyleSelect").onchange = (e) => {
        state.hairStyle = e.target.value;
        renderAvatar();
      };

      document.getElementById("moodSelect").onchange = (e) => {
        state.mood = e.target.value;
        renderAvatar();
      };

      renderAvatar();
    });
  </script>
</body>
</html>
