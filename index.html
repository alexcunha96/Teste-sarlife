<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Teste Visual</title>
  <style>
    :root {
      --bg-color: #080c14;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }

    h1 { text-align: center; font-size: 1.5rem; font-weight: 800; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-bottom: 20px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .avatar-stage {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #070a11 85%);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar-stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .control-group { margin-bottom: 14px; }
    .control-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 700; }
    
    select {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid var(--panel-border);
      background-color: #07090e; color: var(--text-main); font-size: 0.95rem; outline: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Teste de Visualização de Avatares</p>

    <div class="panel">
      <!-- O círculo onde o avatar vai aparecer -->
      <div class="avatar-stage">
        <img id="avatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" alt="Avatar do Jogo">
      </div>

      <div class="control-group">
        <label>Escolher Estilo / Personagem de Teste</label>
        <select id="avatarSelect">
          <option value="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400">Estilo Feminino 1</option>
          <option value="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400">Estilo Masculino 1</option>
          <option value="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400">Estilo Feminino 2</option>
          <option value="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400">Estilo Masculino 2</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    // Código simples para mudar a imagem quando selecionas outra opção no menu
    document.getElementById("avatarSelect").onchange = (e) => {
      document.getElementById("avatarImg").src = e.target.value;
    };
  </script>
</body>
</html>
