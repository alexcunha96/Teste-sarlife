<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - GTA VI Next-Gen Aesthetic</title>
  <style>
    :root {
      --bg-color: #09090b;
      --panel-bg: #18181b;
      --panel-border: #27272a;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #f43f5e; /* Rosa néon / Vibe GTA VI */
      --accent-glow: rgba(244, 63, 94, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    
    h1 { text-align: center; margin-bottom: 4px; color: #ff758f; font-size: 1.5rem; letter-spacing: 0.5px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    }

    .avatar-showcase {
      width: 155px;
      height: 155px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      overflow: hidden;
      background: #09090b;
    }

    .avatar-showcase svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-group { margin-bottom: 12px; }
    .control-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; font-weight: 600; letter-spacing: 0.5px; }
    
    select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--panel-border);
      background-color: #09090b; color: var(--text-main); font-size: 0.95rem; outline: none;
    }
    select:focus { border-color: var(--accent); }

    .swatches { display: flex; gap: 8px; margin-top: 4px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4); transition: transform 0.15s ease;
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.15); }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Next-Gen Edition (GTA VI Vibe)</p>

    <div class="panel">
      <div id="avatarContainer" class="avatar-showcase"></div>

      <div class="control-group">
        <label>Tom de Pele (Cinematográfico)</label>
        <div class="swatches" id="skinSwatches">
          <button class="swatch active" data-color="#fbc4ab" style="background: #fbc4ab;"></button>
          <button class="swatch" data-color="#d89662" style="background: #d89662;"></button>
          <button class="swatch" data-color="#a4663e" style="background: #a4663e;"></button>
          <button class="swatch" data-color="#5c3822" style="background: #5c3822;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Estilo de Cabelo / Look Urbano</label>
        <select id="hairStyleSelect">
          <option value="fadeDread">Fade com Dreadlocks</option>
          <option value="urbanUndercut">Undercut Estilo Urbano</option>
          <option value="capHoodie">Com Capuz / Streetwear</option>
        </select>
      </div>

      <div class="control-group">
        <label>Cor do Cabelo</label>
        <div class="swatches" id="hairSwatches">
          <button class="swatch active" data-color="#111111" style="background: #111111;"></button>
          <button class="swatch" data-color="#7c2d12" style="background: #7c2d12;"></button>
          <button class="swatch" data-color="#b45309" style="background: #b45309;"></button>
          <button class="swatch" data-color="#e5e7eb" style="background: #e5e7eb;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Atitude / Expressão</label>
        <select id="moodSelect">
          <option value="badass">Sério / Criminoso</option>
          <option value="cool">Confiante / Luxo</option>
          <option value="shades">Com Óculos Escuros</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const state = {
      skin: "#fbc4ab",
      hairStyle: "fadeDread",
      hairColor: "#111111",
      mood: "badass"
    };

    function renderAvatar() {
      let hairHTML = "";
      if (state.hairStyle === "fadeDread") {
        hairHTML = `
          <path d="M 22 36 C 18 12, 34 2, 50 6 C 66 2, 82 12, 78 36 C 86 32, 92 48, 76 52 C 68 40, 58 42, 50 42 C 42 42, 32 40, 24 52 C 8 48, 14 32, 22 36 Z" fill="${state.hairColor}" />
          <path d="M 18 42 Q 12 55, 20 62" stroke="${state.hairColor}" stroke-width="4" stroke-linecap="round" fill="none" />
          <path d="M 82 42 Q 88 55, 80 62" stroke="${state.hairColor}" stroke-width="4" stroke-linecap="round" fill="none" />
        `;
      } else if (state.hairStyle === "urbanUndercut") {
        hairHTML = `
          <path d="M 25 34 C 22 14, 38 4, 50 6 C 62 4, 78 14, 75 34 C 82 28, 86 38, 74 44 C 66 36, 58 38, 50 38 C 42 38, 34 36, 26 44 C 14 38, 18 28, 25 34 Z" fill="${state.hairColor}" />
        `;
      } else if (state.hairStyle === "capHoodie") {
        hairHTML = `
          <path d="M 18 45 C 16 18, 36 6, 50 6 C 64 6, 84 18, 82 45 C 90 50, 92 75, 85 96 L 72 96 C 75 70, 70 50, 50 48 C 30 50, 25 70, 28 96 L 15 96 C 8 75, 10 50, 18 45 Z" fill="#27272a" />
          <path d="M 25 38 C 22 16, 38 8, 50 10 C 62 8, 78 16, 75 38 Z" fill="${state.hairColor}" />
        `;
      }

      let faceExtras = "";
      if (state.mood === "badass") {
        faceExtras = `<path d="M 41 64 Q 50 62 59 64" stroke="#3f1d1d" stroke-width="2.5" stroke-linecap="round" fill="none" />`;
      } else if (state.mood === "cool") {
        faceExtras = `<path d="M 40 62 Q 50 70 60 62" stroke="#3f1d1d" stroke-width="2.5" stroke-linecap="round" fill="#e11d48" />`;
      } else if (state.mood === "shades") {
        faceExtras = `
          <path d="M 31 40 L 47 42 L 45 49 L 33 49 Z" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" />
          <path d="M 53 42 L 69 40 L 67 49 L 55 49 Z" fill="#09090b" stroke="#f43f5e" stroke-width="1.5" />
          <line x1="47" y1="43" x2="53" y2="43" stroke="#f43f5e" stroke-width="2" />
          <path d="M 42 63 Q 50 67 58 63" stroke="#3f1d1d" stroke-width="2.5" stroke-linecap="round" fill="none" />
        `;
      }

      const svg = `
        <svg viewBox="0 0 100 100">
          <defs>
            <!-- Gradiente estilo pôr do sol / néon (Vibe Miami/GTA VI) -->
            <radialGradient id="sunsetGlow" cx="50%" cy="40%" r="65%">
              <stop offset="0%" stop-color="#fda4af" />
              <stop offset="60%" stop-color="${state.skin}" />
              <stop offset="100%" stop-color="#881337" stop-opacity="0.4" />
            </radialGradient>
            <!-- Casaco / Roupa urbana de luxo -->
            <linearGradient id="streetwear" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#18181b" />
              <stop offset="50%" stop-color="#09090b" />
              <stop offset="100%" stop-color="#4c0519" />
            </linearGradient>
          </defs>

          <!-- Fundo com iluminação de néon cinematográfica -->
          <circle cx="50" cy="50" r="48" fill="#18181b" />
          <circle cx="50" cy="80" r="30" fill="#f43f5e" opacity="0.15" filter="blur(8px)" />

          <!-- Roupa / Casaco de cabedal ou hoodie -->
          <path d="M 16 96 C 18 70, 82 70, 84 96 Z" fill="url(#streetwear)" />
          <path d="M 38 70 L 50 85 L 62 70 Z" fill="#f43f5e" opacity="0.9" />
          <path d="M 44 70 L 50 78 L 56 70 Z" fill="#09090b" />

          <!-- Pescoço -->
          <rect x="41" y="58" width="18" height="24" fill="url(#sunsetGlow)" />

          <!-- Orelhas -->
          <circle cx="26" cy="45" r="5.5" fill="url(#sunsetGlow)" />
          <circle cx="74" cy="45" r="5.5" fill="url(#sunsetGlow)" />

          <!-- Rosto principal com iluminação dramática -->
          <rect x="27" y="19" width="46" height="51" rx="20" fill="url(#sunsetGlow)" />

          <!-- Olhos (apenas renderizados se não estiver com óculos escuros) -->
          ${state.mood !== 'shades' ? `
            <ellipse cx="37" cy="44" rx="4.5" ry="5" fill="#ffffff" />
            <circle cx="37" cy="44" r="2.8" fill="#09090b" />
            <circle cx="35.5" cy="42.5" r="1" fill="#ffffff" />
            <ellipse cx="63" cy="44" rx="4.5" ry="5" fill="#ffffff" />
            <circle cx="63" cy="44" r="2.8" fill="#09090b" />
            <circle cx="61.5" cy="42.5" r="1" fill="#ffffff" />
          ` : ''}

          <!-- Sobrancelhas vincadas (atitude de jogo AAA) -->
          <path d="M 32 36 L 43 38" stroke="${state.hairColor}" stroke-width="2.5" stroke-linecap="round" />
          <path d="M 57 38 L 68 36" stroke="${state.hairColor}" stroke-width="2.5" stroke-linecap="round" />

          <!-- Nariz marcado -->
          <path d="M 50 42 L 47 52 L 53 52" stroke="rgba(0,0,0,0.2)" stroke-width="2" fill="none" stroke-linecap="round" />

          <!-- Boca / Elementos faciais -->
          ${faceExtras}

          <!-- Cabelo ou Capuz -->
          ${hairHTML}
        </svg>
      `;

      const container = document.getElementById("avatarContainer");
      if (container) {
        container.innerHTML = svg;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("#skinSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#skinSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.skin = btn.dataset.color;
          renderAvatar();
        };
      });

      document.querySelectorAll("#hairSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#hairSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.hairColor = btn.dataset.color;
          renderAvatar();
        };
      });

      document.getElementById("hairStyleSelect").onchange = (e) => {
        state.hairStyle = e.target.value;
        renderAvatar();
      };

      document.getElementById("moodSelect").onchange = (e) => {
        state.mood = e.target.value;
        renderAvatar();
      };

      renderAvatar();
    });
  </script>
</body>
</html>
