<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Professional Avatar Studio</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --panel-bg: #1c2541;
      --panel-border: #3a506b;
      --text-main: #ffffff;
      --text-muted: #8d99ae;
      --accent: #4cc9f0;
      --accent-glow: rgba(76, 201, 240, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }
    
    h1 { text-align: center; margin-bottom: 4px; color: var(--accent); font-size: 1.5rem; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .avatar-showcase {
      width: 150px;
      height: 150px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      overflow: hidden;
      background: #0d1b2a;
    }

    .avatar-showcase svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .control-group { margin-bottom: 12px; }
    .control-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; font-weight: 600; }
    
    select {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--panel-border);
      background-color: var(--bg-color); color: var(--text-main); font-size: 0.95rem; outline: none;
    }

    .swatches { display: flex; gap: 8px; margin-top: 4px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.15s ease;
    }
    .swatch.active { border-color: #ffffff; transform: scale(1.15); }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife</h1>
    <p class="subtitle">Estúdio de Avatar Profissional</p>

    <div class="panel">
      <div id="avatarContainer" class="avatar-showcase"></div>

      <div class="control-group">
        <label>Tom de Pele</label>
        <div class="swatches" id="skinSwatches">
          <button class="swatch active" data-color="#ffdec4" style="background: #ffdec4;"></button>
          <button class="swatch" data-color="#e0ac69" style="background: #e0ac69;"></button>
          <button class="swatch" data-color="#b07d5b" style="background: #b07d5b;"></button>
          <button class="swatch" data-color="#5a3825" style="background: #5a3825;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Estilo de Cabelo</label>
        <select id="hairStyleSelect">
          <option value="texturedCrop">Texturizado Moderno</option>
          <option value="messyWaves">Ondulado / Estilo Livre</option>
          <option value="classicSlick">Executivo Elegante</option>
        </select>
      </div>

      <div class="control-group">
        <label>Cor do Cabelo</label>
        <div class="swatches" id="hairSwatches">
          <button class="swatch active" data-color="#1b1918" style="background: #1b1918;"></button>
          <button class="swatch" data-color="#b45309" style="background: #b45309;"></button>
          <button class="swatch" data-color="#d97706" style="background: #d97706;"></button>
          <button class="swatch" data-color="#9ca3af" style="background: #9ca3af;"></button>
        </div>
      </div>

      <div class="control-group">
        <label>Expressão</label>
        <select id="moodSelect">
          <option value="confident">Confiante / Ambicioso</option>
          <option value="happy">Radiante / Satisfeito</option>
          <option value="serious">Focado / Sério</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    const state = {
      skin: "#ffdec4",
      hairStyle: "texturedCrop",
      hairColor: "#1b1918",
      mood: "confident"
    };

    function renderAvatar() {
      // Camadas de cabelo profissionais de alta definição
      let hairHTML = "";
      if (state.hairStyle === "texturedCrop") {
        hairHTML = `
          <path d="M 24 35 C 20 12, 36 2, 50 6 C 64 2, 80 12, 76 35 C 84 30, 88 42, 76 48 C 68 38, 58 40, 50 40 C 42 40, 32 38, 24 48 C 12 42, 16 30, 24 35 Z" fill="${state.hairColor}" />
          <path d="M 32 20 Q 50 8, 68 20" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-linecap="round" fill="none" />
        `;
      } else if (state.hairStyle === "messyWaves") {
        hairHTML = `
          <path d="M 22 38 C 18 16, 34 4, 50 8 C 66 4, 82 16, 78 38 C 86 32, 90 46, 76 50 C 66 38, 56 42, 50 42 C 44 42, 34 38, 24 50 C 10 46, 14 32, 22 38 Z" fill="${state.hairColor}" />
          <circle cx="36" cy="14" r="8" fill="${state.hairColor}" />
          <circle cx="50" cy="10" r="10" fill="${state.hairColor}" />
          <circle cx="64" cy="14" r="8" fill="${state.hairColor}" />
        `;
      } else if (state.hairStyle === "classicSlick") {
        hairHTML = `
          <path d="M 26 36 C 24 16, 76 16, 74 36 C 70 24, 30 24, 26 36 Z" fill="${state.hairColor}" />
          <path d="M 32 22 C 40 18, 60 18, 68 22" stroke="rgba(255,255,255,0.25)" stroke-width="3" stroke-linecap="round" fill="none" />
        `;
      }

      // Expressões faciais detalhadas
      let mouthHTML = "";
      if (state.mood === "confident") {
        mouthHTML = `<path d="M 41 64 Q 50 68 59 64" stroke="#5a2e2e" stroke-width="3" stroke-linecap="round" fill="none" />`;
      } else if (state.mood === "happy") {
        mouthHTML = `
          <path d="M 39 62 Q 50 72 61 62" stroke="#5a2e2e" stroke-width="3" stroke-linecap="round" fill="#ff8fa3" />
          <path d="M 41 62 Q 50 66 59 62" stroke="#5a2e2e" stroke-width="2" fill="none" />
        `;
      } else if (state.mood === "serious") {
        mouthHTML = `<line x1="42" y1="65" x2="58" y2="65" stroke="#5a2e2e" stroke-width="3" stroke-linecap="round" />`;
      }

      const svg = `
        <svg viewBox="0 0 100 100">
          <defs>
            <radialGradient id="proSkin" cx="50%" cy="30%" r="70%">
              <stop offset="0%" stop-color="${state.skin}" />
              <stop offset="75%" stop-color="${state.skin}" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.25" />
            </radialGradient>
            <linearGradient id="proShirt" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#1e3a8a" />
            </linearGradient>
            <radialGradient id="cheekGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ff758f" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#ff758f" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- Fundo sofisticado -->
          <circle cx="50" cy="50" r="48" fill="#0d1b2a" />
          
          <!-- Corpo / Roupa com gola em V profissional -->
          <path d="M 18 96 C 20 72, 80 72, 82 96 Z" fill="url(#proShirt)" />
          <path d="M 40 72 L 50 84 L 60 72 Z" fill="#ffffff" opacity="0.95" />
          <path d="M 45 72 L 50 79 L 55 72 Z" fill="#1e3a8a" />

          <!-- Pescoço com sombra tridimensional -->
          <rect x="41" y="60" width="18" height="22" fill="url(#proSkin)" />

          <!-- Orelhas estilizadas -->
          <circle cx="26" cy="46" r="6" fill="url(#proSkin)" />
          <circle cx="74" cy="46" r="6" fill="url(#proSkin)" />

          <!-- Rosto principal (Proporção de Alta Qualidade) -->
          <rect x="27" y="20" width="46" height="50" rx="22" fill="url(#proSkin)" />

          <!-- Bochechas com rubor subtil (dá vida ao avatar) -->
          <circle cx="35" cy="53" r="7" fill="url(#cheekGlow)" />
          <circle cx="65" cy="53" r="7" fill="url(#cheekGlow)" />

          <!-- Olhos Premium (Com brilho duplo tipo anime/jogo moderno) -->
          <g>
            <ellipse cx="37" cy="45" rx="5" ry="5.5" fill="#ffffff" />
            <circle cx="37" cy="45" r="3.2" fill="#0f172a" />
            <circle cx="35.5" cy="43.5" r="1.2" fill="#ffffff" />
            <circle cx="38.5" cy="46.5" r="0.5" fill="#ffffff" />
          </g>
          <g>
            <ellipse cx="63" cy="45" rx="5" ry="5.5" fill="#ffffff" />
            <circle cx="63" cy="45" r="3.2" fill="#0f172a" />
            <circle cx="61.5" cy="43.5" r="1.2" fill="#ffffff" />
            <circle cx="64.5" cy="46.5" r="0.5" fill="#ffffff" />
          </g>

          <!-- Sobrancelhas expressivas -->
          <path d="M 31 37 Q 37 33, 43 37" stroke="${state.hairColor}" stroke-width="2.8" stroke-linecap="round" fill="none" />
          <path d="M 57 37 Q 63 33, 69 37" stroke="${state.hairColor}" stroke-width="2.8" stroke-linecap="round" fill="none" />

          <!-- Nariz refinado -->
          <path d="M 50 44 L 47 53 L 53 53" stroke="rgba(0,0,0,0.15)" stroke-width="2" fill="none" stroke-linecap="round" />

          <!-- Boca -->
          ${mouthHTML}

          <!-- Camada de Cabelo Principal -->
          ${hairHTML}
        </svg>
      `;

      const container = document.getElementById("avatarContainer");
      if (container) {
        container.innerHTML = svg;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("#skinSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#skinSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.skin = btn.dataset.color;
          renderAvatar();
        };
      });

      document.querySelectorAll("#hairSwatches .swatch").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#hairSwatches .swatch").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.hairColor = btn.dataset.color;
          renderAvatar();
        };
      });

      document.getElementById("hairStyleSelect").onchange = (e) => {
        state.hairStyle = e.target.value;
        renderAvatar();
      };

      document.getElementById("moodSelect").onchange = (e) => {
        state.mood = e.target.value;
        renderAvatar();
      };

      renderAvatar();
    });
  </script>
</body>
</html>
