<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Modular 3D Studio</title>
  <style>
    :root {
      --bg-color: #080c14;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 520px; }

    h1 { text-align: center; font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

    /* Palco de Composição em Camadas (As peças encaixam umas sobre as outras) */
    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .avatar-stage {
      width: 190px;
      height: 190px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #070a11 85%);
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    /* Cada camada ocupa 100% do espaço e sobrepõe-se perfeitamente */
    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .gender-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      background: #090d16;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .gender-btn {
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gender-btn.active { background: var(--accent); color: #090d16; }

    .grid-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .control-group { margin-bottom: 12px; }
    .control-group.full { grid-column: span 2; }
    .control-group label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.6px; }
    
    select {
      width: 100%; padding: 10px; border-radius: 9px; border: 1px solid var(--panel-border);
      background-color: #090d16; color: var(--text-main); font-size: 0.88rem; outline: none;
    }
    select:focus { border-color: var(--accent); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Personalizar Avatar</h1>
    <p class="subtitle">Sistema Modular 3D Studio</p>

    <div class="panel">
      <!-- Palco onde as camadas de imagem se sobrepõem perfeitamente -->
      <div class="avatar-stage" id="avatarStage">
        <!-- Camada 1: Base (Rosto + Tom de Pele + Camisa) -->
        <img id="layerBase" class="avatar-layer" src="" alt="Base">
        <!-- Camada 2: Olhos e Sobrancelhas -->
        <img id="layerEyes" class="avatar-layer" src="" alt="Olhos">
        <!-- Camada 3: Penteado -->
        <img id="layerHair" class="avatar-layer" src="" alt="Cabelo">
        <!-- Camada 4: Barba / Maquilhagem -->
        <img id="layerDetail" class="avatar-layer" src="" alt="Detalhe">
        <!-- Camada 5: Acessórios (Óculos) -->
        <img id="layerAccessory" class="avatar-layer" src="" alt="Acessório">
      </div>

      <div class="gender-tabs">
        <button class="gender-btn active" data-gender="male">Homem</button>
        <button class="gender-btn" data-gender="female">Mulher</button>
      </div>

      <div class="grid-controls">
        <div class="control-group full">
          <label>Tom de Pele / Base</label>
          <select id="baseSelect">
            <option value="skin_light">Pele Clara</option>
            <option value="skin_warm">Pele Média / Quente</option>
            <option value="skin_olive">Pele Oliva</option>
            <option value="skin_brown">Pele Castanha</option>
            <option value="skin_dark">Pele Escura</option>
          </select>
        </div>

        <div class="control-group">
          <label>Penteado</label>
          <select id="hairSelect">
            <option value="hair_none">Careca / Sem Cabelo</option>
            <option value="hair_short">Curto / Fade</option>
            <option value="hair_waves">Ondulado / Longo</option>
            <option value="hair_curly">Crespo / Volumoso</option>
            <option value="hair_bun">Coque / Apanhado</option>
          </select>
        </div>

        <div class="control-group">
          <label id="detailLabel">Barba / Detalhe</label>
          <select id="detailSelect">
            <option value="det_none">Nenhum</option>
            <option value="det_stubble">Por Fazer</option>
            <option value="det_full">Barba Fechada</option>
            <option value="det_goatee">Cavanhaque</option>
          </select>
        </div>

        <div class="control-group full">
          <label>Acessórios / Óculos</label>
          <select id="accessorySelect">
            <option value="acc_none">Sem Óculos</option>
            <option value="acc_round">Óculos Redondos</option>
            <option value="acc_exec">Armação Executiva</option>
            <option value="acc_shades">Óculos Escuros</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuração do Estado Atual
    let state = {
      gender: "male",
      base: "skin_light",
      eyes: "eyes_standard",
      hair: "hair_short",
      detail: "det_full",
      accessory: "acc_none"
    };

    // Caminho onde vais guardar os recortes transparentes (PNG/WebP) das tuas peças modulares
    const ASSET_PATH = "assets/modules/";

    function updateAvatar() {
      // Atualiza os caminhos das imagens para cada camada individual.
      // NOTA: Certifica-te de que os teus ficheiros PNG transparentes na pasta seguem esta convenção de nomes!
      
      document.getElementById("layerBase").src = `${ASSET_PATH}${state.gender}_${state.base}.png`;
      document.getElementById("layerEyes").src = `${ASSET_PATH}${state.gender}_eyes.png`;
      document.getElementById("layerHair").src = `${ASSET_PATH}${state.hair}.png`;
      document.getElementById("layerDetail").src = `${ASSET_PATH}${state.gender}_${state.detail}.png`;
      
      const accImg = document.getElementById("layerAccessory");
      if (state.accessory === "acc_none") {
        accImg.src = "";
      } else {
        accImg.src = `${ASSET_PATH}${state.accessory}.png`;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      updateAvatar();

      // Alternar Homem / Mulher
      document.querySelectorAll(".gender-btn").forEach(btn => {
        btn.onclick = () => {
          const gender = btn.dataset.gender;
          state.gender = gender;
          
          document.querySelectorAll(".gender-btn").forEach(b => b.classList.toggle("active", b === btn));
          
          // Ajustar rótulos de detalhes consoante o género
          const detailLbl = document.getElementById("detailLabel");
          const detailSel = document.getElementById("detailSelect");
          if (gender === "female") {
            detailLbl.textContent = "Maquilhagem / Rosto";
            detailSel.innerHTML = `
              <option value="det_none">Natural</option>
              <option value="det_makeup1">Glam Suave</option>
              <option value="det_makeup2">Batom Vermelho</option>
            `;
            state.detail = "det_none";
          } else {
            detailLbl.textContent = "Barba / Detalhe";
            detailSel.innerHTML = `
              <option value="det_none">Nenhum</option>
              <option value="det_stubble">Por Fazer</option>
              <option value="det_full">Barba Fechada</option>
              <option value="det_goatee">Cavanhaque</option>
            `;
            state.detail = "det_full";
          }
          
          updateAvatar();
        };
      });

      // Ouvintes para os seletores de customização
      document.getElementById("baseSelect").onchange = (e) => { state.base = e.target.value; updateAvatar(); };
      document.getElementById("hairSelect").onchange = (e) => { state.hair = e.target.value; updateAvatar(); };
      document.getElementById("detailSelect").onchange = (e) => { state.detail = e.target.value; updateAvatar(); };
      document.getElementById("accessorySelect").onchange = (e) => { state.accessory = e.target.value; updateAvatar(); };
    });
  </script>
</body>
</html>
