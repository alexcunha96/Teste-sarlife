<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarLife - Teste Avatar 3D Profissional</title>
  <style>
    :root {
      --bg-color: #152238;
      --panel-bg: #1e3150;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-color: #3b82f6;
      --border-color: #334e7b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0e1726; color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 500px; }
    h1 { text-align: center; margin-bottom: 6px; color: #60a5fa; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    .panel { background-color: var(--panel-bg); border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid var(--border-color); }
    
    .avatar-preview-box {
      width: 140px;
      height: 140px;
      margin: 0 auto 14px auto;
      border-radius: 50%;
      border: 3px solid var(--accent-color);
      overflow: hidden;
      background-color: #111c30;
      box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    }
    .avatar-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .input-group { margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px; }
    .input-group select, .input-group input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color);
      background-color: var(--bg-color); color: var(--text-main); font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⭐ StarLife - Avatares 3D Pro</h1>
    <p class="subtitle">Teste com componentes visuais de alta qualidade.</p>

    <div class="panel">
      <h3>🎨 Personalização</h3>
      
      <!-- Caixa onde aparece o Avatar gerado dinamicamente -->
      <div id="avatarPreviewContainer" class="avatar-preview-box"></div>
      
      <div class="input-group">
        <label>Nome do Personagem (semente para o avatar)</label>
        <input type="text" id="seedInput" value="João Silva" placeholder="Escreve um nome...">
      </div>

      <div class="input-group">
        <label>Estilo de Cabelo / Topo</label>
        <select id="hairStyle">
          <option value="shortFlat">Curto Moderno</option>
          <option value="caesar">Espigado / Texturizado</option>
          <option value="dreads01">Dreads / Volume</option>
          <option value="curly">Caracóis</option>
          <option value="bald">Careca</option>
        </select>
      </div>

      <div class="input-group">
        <label>Pêlo Facial (Barba)</label>
        <select id="facialHair">
          <option value="none">Sem barba</option>
          <option value="beardMedium">Barba Média</option>
          <option value="goatee">Pera / Goatee</option>
        </select>
      </div>

      <div class="input-group">
        <label>Acessório / Óculos</label>
        <select id="accessories">
          <option value="none">Nenhum</option>
          <option value="prescription01">Óculos Graduados</option>
          <option value="sunglasses">Óculos de Sol</option>
        </select>
      </div>
    </div>
  </div>

  <script>
    function updateAvatar() {
      const seed = document.getElementById("seedInput").value || "Starlife";
      const hair = document.getElementById("hairStyle").value;
      const facialHair = document.getElementById("facialHair").value;
      const accessories = document.getElementById("accessories").value;

      // Usamos a API do DiceBear (Estilo 'avataaars' ou 'micah') para gerar um avatar vetorial rico e detalhado
      const url = `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(seed)}&top=${hair}&facialHair=${facialHair}&accessories=${accessories}&backgroundColor=111c30`;

      document.getElementById("avatarPreviewContainer").innerHTML = `<img src="${url}" alt="Avatar">`;
    }

    document.getElementById("seedInput").addEventListener("input", updateAvatar);
    document.getElementById("hairStyle").addEventListener("change", updateAvatar);
    document.getElementById("facialHair").addEventListener("change", updateAvatar);
    document.getElementById("accessories").addEventListener("change", updateAvatar);

    // Gerar ao iniciar
    updateAvatar();
  </script>
</body>
</html>
