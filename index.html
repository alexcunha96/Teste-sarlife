  <style>
    :root {
      --bg-color: #080c14;
      --panel-bg: #111827;
      --panel-border: #1f2937;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .container { width: 100%; max-width: 480px; }

    h1 { text-align: center; font-size: 1.6rem; font-weight: 800; margin-bottom: 4px; }
    p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

    .panel {
      background-color: var(--panel-bg);
      border-radius: 18px;
      padding: 20px;
      border: 1px solid var(--panel-border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .avatar-stage {
      width: 180px;
      height: 180px;
      margin: 0 auto 18px auto;
      border-radius: 50%;
      background: #1e293b;
      border: 3px solid var(--accent);
      box-shadow: 0 0 25px var(--accent-glow);
      position: relative;
      overflow: hidden;
    }

    .avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain; /* Mantém a proporção correta da imagem sem esticar */
      pointer-events: none;
    }

    /* Isola as camadas para garantir que o fundo branco desaparece no modo escuro */
    #layerHair, #layerBeard, #layerGlasses, #layerEyes {
      mix-blend-mode: darken; 
    }

    .gender-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
      background: #07090e;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--panel-border);
    }

    .gender-btn {
      padding: 9px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .gender-btn.active { background: var(--accent); color: #090d16; }

    .controls-grid { display: flex; flex-direction: column; gap: 10px; }
    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #07090e;
      border: 1px solid var(--panel-border);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .control-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; width: 80px; }
    
    .arrow-group { display: flex; align-items: center; gap: 10px; }
    .arrow-btn {
      background: #1f2937;
      color: var(--text-main);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .arrow-btn:active { background: var(--accent); color: #090d16; }
    .value-display { font-size: 0.85rem; font-weight: 600; width: 90px; text-align: center; color: var(--accent); }
  </style>
